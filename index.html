<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian TV Channels - IPTV Player</title>

<style>
  :root {
    --bg: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-card-hover: #252545;
    --accent: #ff6b35;
    --accent-hover: #ff8555;
    --text: #e8e8f0;
    --text-muted: #8888a0;
    --border: #2a2a45;
    --player-bg: #000;
    --success: #4ade80;
    --danger: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), #ff4757);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo h1 { font-size: 22px; font-weight: 700; }
  .logo span { color: var(--accent); }
  .search-box {
    position: relative;
    flex: 1;
    max-width: 400px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,53,0.15);
  }
  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
  }
  .player-section {
    background: var(--bg-card);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .player-container {
    position: relative;
    background: var(--player-bg);
    aspect-ratio: 16/9;
    max-height: 500px;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
  }
  .player-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 12px;
  }
  .player-placeholder svg { opacity: 0.5; }
  .player-info {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .now-playing {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .now-playing img {
    width: 48px; height: 48px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--bg);
  }
  .now-playing h3 { font-size: 16px; font-weight: 600; }
  .now-playing p { font-size: 13px; color: var(--text-muted); }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(74,222,128,0.1);
    color: var(--success);
  }
  .status.offline {
    background: rgba(248,113,113,0.1);
    color: var(--danger);
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding-bottom: 8px;
    overflow-x: auto;
  }
  .filter-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover {
    background: var(--bg-card-hover);
    color: var(--text);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .stats {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .channel-card {
    background: var(--bg-card);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .channel-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 32px rgba(255,107,53,0.15);
  }
  .channel-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .channel-logo {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: contain;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    padding: 12px;
    display: block;
  }
  .channel-logo[src=""] { display: none; }
  .channel-logo-fallback {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .channel-info {
    padding: 10px 12px;
  }
  .channel-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .channel-group {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .play-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(100% - 60px);
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .channel-card:hover .play-overlay { opacity: 1; }
  .play-btn {
    width: 48px; height: 48px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-muted);
  }
  .no-results {
    text-align: center;
    padding: 60px;
    color: var(--text-muted);
  }
  .footer {
    text-align: center;
    padding: 40px 24px;
    color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 768px) {
    .header-inner { flex-direction: column; align-items: stretch; }
    .search-box { max-width: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .player-info { flex-direction: column; align-items: flex-start; }
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 13px;
    z-index: 1000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>

let currentHls = null;
let currentChannel = null;
let activeFilter = 'All';
let searchQuery = '';

function getGroups() {
  const groups = {};
  channels.forEach(c => {
    const g = c.group || 'Other';
    groups[g] = (groups[g] || 0) + 1;
  });
  return Object.entries(groups).sort((a,b) => b[1] - a[1]);
}

function renderFilters() {
  const container = document.getElementById('filters');
  const groups = getGroups();
  let html = `<button class="filter-btn ${activeFilter === 'All' ? 'active' : ''}" onclick="setFilter('All')">All (${channels.length})</button>`;
  groups.forEach(([name, count]) => {
    html += `<button class="filter-btn ${activeFilter === name ? 'active' : ''}" onclick="setFilter('${name.replace(/'/g,"\'")}')">${name} (${count})</button>`;
  });
  container.innerHTML = html;
}

function setFilter(filter) {
  activeFilter = filter;
  renderFilters();
  renderGrid();
}

function getFilteredChannels() {
  let result = channels;
  if (activeFilter !== 'All') {
    result = result.filter(c => c.group === activeFilter);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    result = result.filter(c => c.name.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
  }
  return result;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtered = getFilteredChannels();
  document.getElementById('stats').textContent = `Showing ${filtered.length} channel${filtered.length !== 1 ? 's' : ''}`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results" style="grid-column:1/-1;"><h3>No channels found</h3><p>Try a different search or category</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(ch => {
    const isActive = currentChannel && currentChannel.url === ch.url;
    const logoHtml = ch.logo
      ? `<img class="channel-logo" src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
      : '';
    const fallbackHtml = `<div class="channel-logo-fallback" style="${ch.logo ? 'display:none;' : ''}">📺</div>`;
    return `
      <div class="channel-card ${isActive ? 'active' : ''}" onclick="playChannel(${channels.indexOf(ch)})">
        ${logoHtml}${fallbackHtml}
        <div class="play-overlay"><div class="play-btn">▶</div></div>
        <div class="channel-info">
          <div class="channel-name" title="${ch.name}">${ch.name}</div>
          <div class="channel-group">${ch.group}</div>
        </div>
      </div>
    `;
  }).join('');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function playChannel(index) {
  const ch = channels[index];
  currentChannel = ch;

  const video = document.getElementById('videoPlayer');
  const placeholder = document.getElementById('playerPlaceholder');
  const nowPlayingImg = document.getElementById('nowPlayingImg');
  const nowPlayingName = document.getElementById('nowPlayingName');
  const nowPlayingGroup = document.getElementById('nowPlayingGroup');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');

  placeholder.style.display = 'none';
  video.style.display = 'block';

  nowPlayingImg.src = ch.logo || '';
  nowPlayingImg.style.display = ch.logo ? 'block' : 'none';
  nowPlayingName.textContent = ch.name;
  nowPlayingGroup.textContent = ch.group;
  statusBadge.className = 'status';
  statusText.textContent = 'Loading...';

  renderGrid();

  if (currentHls) {
    currentHls.destroy();
    currentHls = null;
  }

  video.pause();
  video.src = '';

  if (Hls.isSupported()) {
    currentHls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      enableWorker: true,
    });
    currentHls.loadSource(ch.url);
    currentHls.attachMedia(video);
    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(() => {});
      statusBadge.className = 'status';
      statusText.textContent = 'Live';
    });
    currentHls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        statusBadge.className = 'status offline';
        statusText.textContent = 'Error';
        showToast('Failed to load stream. Channel may be offline.');
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = ch.url;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(() => {});
      statusBadge.className = 'status';
      statusText.textContent = 'Live';
    });
    video.addEventListener('error', () => {
      statusBadge.className = 'status offline';
      statusText.textContent = 'Error';
      showToast('Failed to load stream. Channel may be offline.');
    });
  } else {
    showToast('Your browser does not support HLS playback.');
  }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderGrid();
});

renderFilters();
renderGrid();
</script>
